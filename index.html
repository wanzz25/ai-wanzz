<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wanzz AI - Clean Code</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <style>
        :root {
            --wa-bg: #0b141a;
            --wa-header: #202c33;
            --wa-user-msg: #005c4b;
            --wa-ai-msg: #202c33;
            --wa-input: #2a3942;
            --wa-green: #00a884;
        }
        body { background-color: var(--wa-bg); color: #e9edef; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; margin: 0; overflow: hidden; }
        
        .chat-container { 
            flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-blend-mode: overlay; background-size: 500px;
        }

        .bubble { max-width: 88%; padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 1.5; box-shadow: 0 1px 2px rgba(0,0,0,0.3); position: relative; }
        .user { background: var(--wa-user-msg); align-self: flex-end; border-top-right-radius: 0; }
        .ai { background: var(--wa-ai-msg); align-self: flex-start; border-top-left-radius: 0; width: fit-content; min-width: 60px; }
        
        /* FIX KODE: TETAP HORIZONTAL DENGAN SCROLL HALUS */
        .code-wrapper { 
            margin: 10px 0; border-radius: 8px; overflow: hidden; 
            border: 1px solid #3c454a; background: #1d2124; width: 100%;
        }
        .code-header { 
            background: #343f46; display: flex; justify-content: space-between; 
            align-items: center; padding: 6px 12px; font-size: 11px; color: #adbac7; border-bottom: 1px solid #3c454a;
        }
        .copy-btn { background: var(--wa-green); color: white; border: none; padding: 3px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; }
        
        pre[class*="language-"] { 
            margin: 0 !important; padding: 15px !important; 
            background: #1d2124 !important; font-size: 13px !important;
            line-height: 1.6 !important; 
            /* Jangan dipotong ke bawah, biar bisa digeser */
            white-space: pre !important; 
            overflow-x: auto !important; 
        }
        /* Scrollbar Halus untuk Kode */
        pre::-webkit-scrollbar { height: 4px; }
        pre::-webkit-scrollbar-thumb { background: #4a555b; border-radius: 10px; }

        /* Bubble Mengetik */
        .typing { display: flex; gap: 4px; padding: 14px 18px !important; }
        .dot { width: 6px; height: 6px; background: #8696a0; border-radius: 50%; animation: blink 1.4s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .footer { background: var(--wa-header); padding: 10px; display: flex; align-items: center; gap: 8px; }
        textarea { background: var(--wa-input); border: none; border-radius: 20px; padding: 10px 15px; color: white; flex: 1; outline: none; resize: none; max-height: 100px; font-size: 16px; }
        .send-btn { background: var(--wa-green); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <header class="p-4 flex justify-between items-center" style="background: var(--wa-header);">
        <div>
            <div class="font-bold text-lg">Wanzz AI</div>
            <div id="status" class="text-xs text-emerald-500">online</div>
        </div>
        <div class="text-[9px] text-slate-400 font-bold uppercase text-right leading-tight">
            Developer<br><span class="text-emerald-500">Wanzz</span>
        </div>
    </header>

    <main id="chat-box" class="chat-container"></main>

    <footer class="footer">
        <textarea id="user-input" rows="1" placeholder="Ketik pesan..." oninput="this.style.height='';this.style.height=this.scrollHeight+'px'"></textarea>
        <button class="send-btn" onclick="kirim()">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
    </footer>

    <script>
        const API_KEY = "AIzaSyCffPD6entx7gNmx8daaH1V8GBX7rJPAkE";
        const URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;

        const box = document.getElementById('chat-box');
        const input = document.getElementById('user-input');
        const status = document.getElementById('status');
        
        let history = [
            { role: "user", parts: [{ text: "Namamu Wanzz AI, dikembangkan oleh Wanzz. Jawablah pesan dengan ramah dan profesional." }] },
            { role: "model", parts: [{ text: "Siap Wanzz, ada yang bisa saya bantu hari ini?" }] }
        ];

        function copyCode(btn, codeId) {
            const text = document.getElementById(codeId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                btn.innerText = "Selesai"; setTimeout(() => btn.innerText = "Salin", 2000);
            });
        }

        function parseResponse(text) {
            const regex = /```(\w*)\n([\s\S]*?)```/g;
            let i = 0;
            let res = text.replace(regex, (m, lang, code) => {
                i++; const id = `c-${Date.now()}-${i}`;
                return `<div class="code-wrapper">
                            <div class="code-header"><span>${lang.toUpperCase() || 'CODE'}</span><button class="copy-btn" onclick="copyCode(this, '${id}')">Salin</button></div>
                            <pre class="language-${lang}"><code id="${id}">${code.trim().replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>
                        </div>`;
            });
            return res.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        }

        async function kirim() {
            const val = input.value.trim(); if(!val) return;
            
            const u = document.createElement('div'); u.className = 'bubble user'; u.textContent = val; box.appendChild(u);
            input.value = ''; input.style.height = 'auto'; status.textContent = 'mengetik...';

            const t = document.createElement('div'); t.className = 'bubble ai typing'; t.id = 't-b';
            t.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            box.appendChild(t); box.scrollTo(0, box.scrollHeight);

            try {
                history.push({ role: "user", parts: [{ text: val }] });
                const r = await fetch(URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ contents: history }) });
                const d = await r.json(); const reply = d.candidates[0].content.parts[0].text;
                history.push({ role: "model", parts: [{ text: reply }] });
                
                document.getElementById('t-b').remove();
                const a = document.createElement('div'); a.className = 'bubble ai'; a.innerHTML = parseResponse(reply);
                box.appendChild(a); Prism.highlightAllUnder(a);
            } catch (e) { 
                if(document.getElementById('t-b')) document.getElementById('t-b').remove();
                console.error(e);
            }
            status.textContent = 'online'; box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
        }
        
        input.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); kirim(); } });
    </script>
</body>
</html>
